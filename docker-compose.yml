services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env.example
    environment:
      MYSQL_HOST: mysql
      PORT: 5001
      AI_ENABLED: ${AI_ENABLED:-false}
    ports:
      - "5001:5001"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/check-auth', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - .:/app

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:5001
        NEXT_BACKEND_INTERNAL_URL: http://backend:5001
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:5001
      NEXT_BACKEND_INTERNAL_URL: http://backend:5001
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: giam_sat
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  mysql_data:
